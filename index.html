<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trazzo · Centro de Control</title>
  <meta name="description" content="Trazzo: emprendimiento de tecnología logística. Centro de control web para registrar, asignar y monitorear rutas de carga desde el navegador, la pantalla del patio y el reloj del operador.">
  <meta name="author" content="Iván Arcos">
  <meta name="theme-color" content="#12306b">

  <!-- Iconos y PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trazzo">

  <!-- Tipografías: Inter (texto) y JetBrains Mono (folios y cifras) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Leaflet: mapa con OpenStreetMap para la vista previa de la ruta -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
